<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your Pradhan Homestay account.">
  <meta name="theme-color" content="#12364a">
  <title>Sign in | Pradhan Homestay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">
  <script defer src="script.js"></script>
  <script type="module" src="auth.js"></script>
</head>
<body class="auth-page">
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html" aria-label="Pradhan Homestay home"><span class="brand-mark">PH</span><span><b>Pradhan</b><small>Homestay</small></span></a>
      <a class="auth-home-link" href="index.html">Back to home <span>↗</span></a>
    </div>
  </header>
  <main class="auth-main">
    <section class="auth-card" aria-labelledby="auth-title">
      <p class="eyebrow">Welcome back</p>
      <h1 id="auth-title">Sign in to<br><em>your stay.</em></h1>
      <p class="auth-intro">Pick up where you left off and plan your next few days in the hills.</p>
      <form class="auth-form" data-auth-form="login">
        <label>Email address<input name="email" type="email" autocomplete="email" required></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required minlength="8"></label>
        <button class="button button-gold" type="submit">Sign in <span>↗</span></button>
        <p class="form-message" aria-live="polite"></p>
      </form>
      <p class="auth-switch">New to Pradhan? <a href="signup.html">Create an account</a></p>
    </section>
  </main>
  <footer class="auth-footer"><a href="terms.html">Terms</a><span>·</span><a href="privacy.html">Privacy</a></footer>
</body>
</html>
